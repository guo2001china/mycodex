name: Feature request
description: Suggest a new capability or workflow.
title: "[Feature]: "
labels: ["enhancement", "needs-feedback"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should DeepSeek企业桌面版 solve?
      description: Describe the user scenario, not only the feature name.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: What should the skill-order workflow look like?
      placeholder: "I want to open DeepSeek企业桌面版, provide ..., and receive ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Token sharing
        - AI skill order
        - Desktop Agent workflow
        - Computer automation
        - Browser automation
        - Model provider
        - File preview
        - Installer
        - Other
    validations:
      required: true
