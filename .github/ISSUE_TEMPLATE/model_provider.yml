name: Model provider or Token sharing request
description: Request or report a model provider, subscription account, API Key integration, or team Token sharing setup.
title: "[Provider]: "
labels: ["model-provider", "needs-feedback"]
body:
  - type: input
    id: provider
    attributes:
      label: Provider or shared capacity name
      placeholder: "DeepSeek, Gemini, Qwen, Claude, internal gateway, team quota pool..."
    validations:
      required: true
  - type: dropdown
    id: credential
    attributes:
      label: Preferred connection
      options:
        - Team Token sharing
        - Controlled API gateway
        - Subscription account
        - API Key managed by admin
        - OAuth
        - Not sure
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: What skill orders should this model capacity support?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Do not paste keys, tokens, cookies, or account secrets. Token sharing should describe controlled access, not plaintext keys.
