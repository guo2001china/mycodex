name: Community feedback
description: Share how you use DeepSeek企业桌面版 or what blocks adoption.
title: "[Feedback]: "
labels: ["community", "needs-feedback"]
body:
  - type: textarea
    id: role
    attributes:
      label: Who are you using DeepSeek企业桌面版 for?
      placeholder: "Sales, operations, support, recruiting, admin, research, team workflow..."
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: What skill order or workflow are you trying to run?
    validations:
      required: true
  - type: textarea
    id: blocker
    attributes:
      label: What is blocking you?
      placeholder: "Install, login, Token sharing, model setup, browser task, files, unclear docs..."
